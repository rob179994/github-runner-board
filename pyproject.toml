[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-runner-board"
version = "0.1.0"
description = "Read-only GitHub Actions runner queue dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Robert McCormack"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
runner-board = "github_runner_board:main"

[tool.setuptools.packages.find]
include = ["github_runner_board*"]

[tool.setuptools.package-data]
github_runner_board = ["static/index.html"]
